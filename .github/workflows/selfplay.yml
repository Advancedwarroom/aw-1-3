name: 自对弈回归 + 冒烟
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1

jobs:
  smoke:
    name: 冒烟（主场景无头启动不崩）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 装 .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: 编译 C# 游戏程序集
        run: dotnet build AWone1.csproj -nologo
      - name: 下载 Godot 4.7.1 Mono 无头版
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          unzip -o Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          sudo ln -s $PWD/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64 /usr/local/bin/godot
      - name: 导入资源
        run: godot --headless --import --path . --quit
      - name: 杀掉 MSBuild 服务进程
        run: dotnet build-server shutdown
      - name: 主场景无头跑 600 帧
        run: timeout 300 godot --headless --path . --quit-after 600

  selfplay:
    name: 双AI自对弈回归（60阶段）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 装 .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: 编译 C# 游戏程序集
        run: dotnet build AWone1.csproj -nologo
      - name: 下载 Godot 4.7.1 Mono 无头版
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          unzip -o Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          sudo ln -s $PWD/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64 /usr/local/bin/godot
      - name: 导入资源
        run: godot --headless --import --path . --quit
      - name: 杀掉 MSBuild 服务进程
        run: dotnet build-server shutdown
      - name: 双AI自对弈 60 阶段
        run: |
          mkdir -p build
          set -o pipefail
          timeout 900 godot --headless --path . res://tests/selfplay.tscn -- --max-phases 60 2>&1 | tee build/selfplay.log
      - name: 运行时错误检查（适配开创人 ScreenErrorLogger：CI 直接炸）
        run: |
          if grep -E "SCRIPT ERROR|Failed to load hue" build/selfplay.log; then
            echo "发现运行时错误（见上方匹配行）"; exit 1
          fi
      - name: 失败时导出日志（发这个给我）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfplay-log
          path: build/selfplay.log

  recolor-check:
    name: 设施换色断言（P-1必须紫）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 装 .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: 编译 C# 游戏程序集
        run: dotnet build AWone1.csproj -nologo
      - name: 下载 Godot 4.7.1 Mono 无头版
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          unzip -o Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          sudo ln -s $PWD/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64 /usr/local/bin/godot
      - name: 导入资源
        run: godot --headless --import --path . --quit
      - name: 杀掉 MSBuild 服务进程
        run: dotnet build-server shutdown
      - name: City P-1 换色断言
        run: |
          mkdir -p build
          timeout 120 godot --headless --path . res://tests/facility_recolor_check.tscn 2>&1 | tee build/recolor.log
          exit ${PIPESTATUS[0]}
      - name: 断言日志上汇总页（截图即报错同款哲学）
        if: always()
        run: mkdir -p build && cat build/recolor.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
